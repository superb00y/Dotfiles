[manager]
cwd = { fg = "#b3cad4", bold=true}

hovered         = { fg = "#b4ebff", bg = "#004e5f" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#b4ebff", bg = "#004e5f" }

# Mode
mode_normal = { fg = "#003642",   bg = "#87d1ea", bold = true }
mode_select = { fg = "#1d333b", bg = "#b3cad4", bold = true }
mode_unset  = { fg = "#2b2e4d",  bg = "#c1c4eb", bold = true }

[which]
mask            = { bg = "#1b2023" }
cand            = { fg = "#87d1ea" }
desc            = { fg = "#b3cad4" }
separator       = "  "
separator_style = { fg = "#c1c4eb" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b3cad4" },

	# Videos
	{ mime = "video/*", fg = "#c1c4eb" },
	{ mime = "audio/*", fg = "#c1c4eb" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#87d1ea", bold=true },
	{ name = "*/", fg = "#b3cad4", bold=true }
]
